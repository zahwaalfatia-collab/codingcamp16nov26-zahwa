<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Focus Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="header">
    <div class="header__left">
      <p id="datetime" class="header__datetime"></p>
      <h1 id="greeting" class="header__greeting"></h1>
    </div>
    <div class="header__right">
      <!-- Custom Name -->
      <div class="name-form">
        <input id="nameInput" type="text" placeholder="Your name…" maxlength="30" />
        <button id="saveNameBtn">Save</button>
      </div>
      <!-- Dark / Light toggle -->
      <button id="themeToggle" class="theme-btn" title="Toggle theme">🌙</button>
    </div>
  </header>

  <main class="grid">

    <!-- ===== FOCUS TIMER ===== -->
    <section class="card timer-card">
      <h2 class="card__title">Focus Timer</h2>

      <!-- Custom duration (Challenge: Change Pomodoro time) -->
      <div class="timer__duration-row">
        <label for="durationInput">Minutes:</label>
        <input id="durationInput" type="number" min="1" max="120" value="25" />
        <button id="setDurationBtn">Set</button>
      </div>

      <div class="timer__display" id="timerDisplay">25:00</div>

      <div class="timer__controls">
        <button id="startBtn" class="btn btn--primary">Start</button>
        <button id="stopBtn" class="btn btn--secondary" disabled>Stop</button>
        <button id="resetBtn" class="btn btn--ghost">Reset</button>
      </div>
    </section>

    <!-- ===== TO-DO LIST ===== -->
    <section class="card todo-card">
      <h2 class="card__title">To-Do List</h2>

      <div class="todo__input-row">
        <input id="todoInput" type="text" placeholder="Add a task…" maxlength="100" />
        <button id="addTodoBtn" class="btn btn--primary">Add</button>
      </div>

      <!-- Sort controls -->
      <div class="todo__sort-row">
        <span class="sort-label">Sort:</span>
        <button id="sortAZ" class="btn btn--ghost btn--sm">A → Z</button>
        <button id="sortZA" class="btn btn--ghost btn--sm">Z → A</button>
        <button id="sortDefault" class="btn btn--ghost btn--sm">Default</button>
      </div>

      <ul id="todoList" class="todo__list"></ul>
    </section>

    <!-- ===== QUICK LINKS ===== -->
    <section class="card links-card">
      <h2 class="card__title">Quick Links</h2>

      <div class="links__input-row">
        <input id="linkName" type="text" placeholder="Label" maxlength="30" />
        <input id="linkUrl" type="url" placeholder="https://…" />
        <button id="addLinkBtn" class="btn btn--primary">Add</button>
      </div>

      <div id="linkGrid" class="links__grid"></div>
    </section>

  </main>

  <script src="js/app.js"></script>
</body>
</html>
